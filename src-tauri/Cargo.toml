[package]
name = "kook_voice_lite"
version = "0.1.0"
description = "A minimal KOOK voice client"
authors = ["KOOK Voice Lite"]
edition = "2021"

[lib]
name = "kook_voice_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = "symbols"
